<!DOCTYPE html>
<html lang="th">
<head>
<script>try{const t=localStorage.getItem("theme");document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบจัดการการแข่งขันกีฬาสหวิทยาเขต</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4338ca">
<meta name="apple-mobile-web-app-title" content="SPK Games">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#e9eafb;--bg2:#d9d6fa;--card:#ffffff;--card2:#f0f0fd;--ink:#14143a;--muted:#474c6c;--line:#d8daf3;--line2:#bfc3ea;
  --pri:#4338ca;--pri-h:#3730a3;--pri-soft:#e2dffd;--pri-ink:#3730a3;--on-pri:#ffffff;
  --hdr:linear-gradient(115deg,#312e81 0%,#4338ca 55%,#6d28d9 100%);--hdr-ink:#ffffff;--hdr-muted:#dcdcff;--hdr-ctl:rgba(255,255,255,.14);--hdr-ctl-line:rgba(255,255,255,.38);--hdr-ctl-ink:#ffffff;--nav:#2e2a78;--nav-ink:#d4d5fb;--nav-on:#ffffff;--nav-bar:#c4b5fd;
  --gold:#8f6a00;--silver:#6b7686;--bronze:#a35a1f;--medal-ink:#ffffff;
  --live:#c81e1e;--live-bg:#fde8e8;--ok:#0b7a5f;--ok-bg:#dff5ee;--warn:#8a4b00;--warn-bg:#fff4dc;--warn-line:#f1d495;
  --neutral-bg:#eceef7;--neutral-ink:#3c4263;--bye-bg:#f5eedd;--bye-ink:#6e5317;
  --info-bg:#e2dffd;--info-line:#c9c3f8;--info-ink:#3730a3;
  --danger:#b42318;--danger-line:#f1c4bf;--win-bg:#eefaf5;
  --shadow:0 1px 2px rgba(49,46,129,.08),0 6px 18px rgba(67,56,202,.08);--r:14px;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e0f22;--bg2:#15173a;--card:#171932;--card2:#1e2142;--ink:#f1f2ff;--muted:#b9bddb;--line:#2a2d52;--line2:#3a3e6b;
  --pri:#8b8cf8;--pri-h:#a5a6fb;--pri-soft:#272a5e;--pri-ink:#c7c8ff;--on-pri:#0e0f22;
  --hdr:#131430;--hdr-ink:#f1f2ff;--hdr-muted:#b9bddb;--hdr-ctl:#171932;--hdr-ctl-line:#3a3e6b;--hdr-ctl-ink:#f1f2ff;--nav:#131430;--nav-ink:#b9bddb;--nav-on:#c7c8ff;--nav-bar:#8b8cf8;
  --gold:#f2c94c;--silver:#c3cad6;--bronze:#e39a5c;--medal-ink:#14143a;
  --live:#ff8a8a;--live-bg:#3d1520;--ok:#5fe0b8;--ok-bg:#0f3a30;--warn:#ffcf70;--warn-bg:#3a2a0c;--warn-line:#6b4f16;
  --neutral-bg:#262a4d;--neutral-ink:#d6d9f2;--bye-bg:#3a3018;--bye-ink:#f0d89a;
  --info-bg:#232659;--info-line:#3a3e86;--info-ink:#cfd0ff;
  --danger:#ff8f86;--danger-line:#6b2a2a;--win-bg:#14352d;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Anuphan',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.55;transition:background .2s,color .2s}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri-ink);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px;border-radius:6px}
header{background:var(--hdr);color:var(--hdr-ink);padding:16px 20px 14px}
.hwrap{max-width:1140px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{width:58px;height:58px;border-radius:50%;background:#fff;object-fit:contain;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.55),0 4px 14px rgba(20,16,80,.35)}
.htitle{flex:1;min-width:200px}
.htitle h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.1px}
.htitle p{margin:2px 0 0;color:var(--hdr-muted);font-size:13.5px}
.rolebox{display:flex;gap:8px;align-items:center;font-size:13.5px;flex-wrap:wrap}
.rolebox select option{color:#14143a;background:#fff}
.rolebox select{background:var(--hdr-ctl);border:1px solid var(--hdr-ctl-line);color:var(--hdr-ctl-ink);border-radius:9px;padding:5px 8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--hdr-ctl);color:var(--hdr-ctl-ink);border:1px solid var(--hdr-ctl-line)}
.themebtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--hdr-ctl-line);background:var(--hdr-ctl);color:var(--hdr-ctl-ink);cursor:pointer;display:grid;place-items:center}
.themebtn svg{width:19px;height:19px}
.themebtn:hover{border-color:var(--hdr-ctl-ink)}
nav{background:var(--nav);position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(30,27,75,.18)}
.nwrap{max-width:1140px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 12px}
.nwrap::-webkit-scrollbar{display:none}
nav a{color:var(--nav-ink);text-decoration:none;padding:12px 14px 10px;white-space:nowrap;font-weight:500;border-bottom:3px solid transparent;font-size:14.5px}
nav a:hover{color:var(--nav-on)}
nav a.on{color:var(--nav-on);border-bottom-color:var(--nav-bar);font-weight:700}
main{max-width:1140px;margin:0 auto;padding:22px 16px 80px}
.banner{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:14px}
.banner.info{background:var(--info-bg);border-color:var(--info-line);color:var(--info-ink)}
h2.pt{font-size:23px;margin:0 0 4px;letter-spacing:.1px}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.live{border-color:var(--live)}
.card h3{margin:0 0 12px;font-size:16px;color:var(--pri-ink);display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.btn{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--pri);color:var(--pri-ink)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri);font-weight:600}
.btn.pri:hover{background:var(--pri-h);border-color:var(--pri-h);color:var(--on-pri)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.dan{color:var(--danger);border-color:var(--danger-line)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:none;color:var(--pri-ink);cursor:pointer;padding:0;font-weight:600}
select.f,input.f,textarea.f{border:1px solid var(--line2);border-radius:9px;padding:7px 10px;background:var(--card);color:var(--ink);min-width:0}
select.f:focus,input.f:focus,textarea.f:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
textarea.f{width:100%;min-height:110px;resize:vertical}
.hero{background:linear-gradient(135deg,var(--card) 0%,var(--card) 35%,var(--bg2) 100%);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-bottom:18px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.28),transparent 70%);pointer-events:none}
.hero h2{margin:0;font-size:24px}
.hero p{margin:4px 0 0;color:var(--muted)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:100px}
.stat b{display:block;font-size:23px;line-height:1.15;color:var(--pri-ink)}
.stat span{font-size:12.5px;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line2)}
.sch{display:inline-flex;align-items:center;gap:7px;min-width:0}
.sch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.match:first-child{border-top:none}
.match .tm{font-weight:700;font-size:14px}
.match .tm small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.match .ev{font-size:12.5px;color:var(--muted);margin-bottom:4px;display:flex;gap:6px;align-items:flex-start}
.match .ev .evt{flex:1;min-width:0}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.vs .b{justify-content:flex-end;text-align:right}
.vs .sc{font-weight:700;font-size:16px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:1px 10px;white-space:nowrap;min-width:64px;text-align:center}
.vs .win{font-weight:700}
.tbd{color:var(--muted);font-style:italic}
.badge{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;display:inline-block}
.b-live{background:var(--live-bg);color:var(--live)}
.b-live::before{content:'● ';animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
.b-done{background:var(--ok-bg);color:var(--ok)}
.b-sch{background:var(--neutral-bg);color:var(--neutral-ink)}
.b-bye{background:var(--bye-bg);color:var(--bye-ink)}
.clickable{cursor:pointer;transition:background .12s}
.clickable:hover{background:var(--card2)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line)}
table.t td.n,table.t th.n{text-align:center}
.med{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:700;font-size:13px;color:var(--medal-ink)}
.mg{background:var(--gold)}.ms{background:var(--silver)}.mb{background:var(--bronze)}
.rank{font-weight:700;width:28px;text-align:center}
.r1 .rank{color:var(--gold)}
.podium{display:flex;flex-direction:column;gap:5px}
.pod{display:flex;align-items:center;gap:8px;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:7px 16px;border-radius:99px;cursor:pointer;font-weight:500}
.tabs button.on{background:var(--pri);color:var(--on-pri);border-color:var(--pri);font-weight:600}
.dayh{font-weight:700;margin:22px 0 8px;font-size:16px;color:var(--pri-ink);display:flex;align-items:center;gap:8px}
.dayh.today::after{content:'วันนี้';font-size:11px;background:var(--pri);color:var(--on-pri);padding:1px 9px;border-radius:99px}
.evrow{display:flex;align-items:center;gap:12px;padding:10px 6px;border-top:1px solid var(--line)}
.evrow:first-child{border-top:none}
.evrow .ic{font-size:21px;width:36px;height:36px;border-radius:10px;background:var(--pri-soft);display:grid;place-items:center;flex:none}
.evrow .tt{flex:1;min-width:0}
.evrow .tt b{font-weight:600}
.evrow .tt small{display:block;color:var(--muted);font-size:12.5px}
.schcard{border-top:5px solid var(--c,#ccc)}
.schcard h4{margin:0 0 2px;font-size:16px}
.mrow{display:flex;gap:8px;margin-top:10px;align-items:center}
.nbadge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:#e11d48;color:#fff;font-size:12px;font-weight:700;line-height:1;vertical-align:1px}
.news.unread h4::after{content:'ใหม่';display:inline-block;margin-left:8px;padding:1px 8px;border-radius:99px;background:#e11d48;color:#fff;font-size:11.5px;font-weight:700;vertical-align:2px}
.news.unread{position:relative}
.home{display:flex;flex-direction:column;gap:16px}
.home>.card,.duo>.card{margin:0}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}
.duo .mw{grid-template-columns:72px minmax(0,1fr);gap:8px 12px;padding:12px 2px}
.duo .mw .teams{grid-column:1/-1}
@media (max-width:900px){.duo{grid-template-columns:minmax(0,1fr)}}
.mw{display:grid;grid-template-columns:96px minmax(0,1.1fr) minmax(0,1.4fr);gap:14px;align-items:center;padding:12px 6px;border-top:1px solid var(--line)}
.mw:first-of-type{border-top:0}
.mw .tm{font-weight:700;font-size:15px;line-height:1.3}
.mw .tm small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.mw .info{font-size:14px;line-height:1.45}
.mw .info b{font-weight:700}
.mw .info .meta{color:var(--muted);font-size:13px}
.mw .teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.mw .teams .sch span{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35}
.mw .teams .tb{display:flex;justify-content:flex-end;text-align:right}
.mw .teams .tb .sch{flex-direction:row-reverse}
.mw .teams .win{font-weight:700}
.mw .sc{font-weight:700;font-size:17px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 10px;white-space:nowrap;min-width:64px;text-align:center}
.mw .sc.done{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
@media (max-width:760px){
  .mw{grid-template-columns:72px minmax(0,1fr);gap:8px 12px;padding:12px 2px}
  .mw .teams{grid-column:1/-1}
}
.bracket{display:flex;gap:18px;overflow-x:auto;padding-bottom:8px}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-width:210px}
.bcol h5{margin:0 0 4px;font-size:13px;color:var(--muted);text-align:center}
.bm{border:1px solid var(--line2);border-radius:10px;background:var(--card);overflow:hidden;font-size:13.5px}
.bm .t{display:flex;justify-content:space-between;gap:8px;padding:6px 10px}
.bm .t+.t{border-top:1px solid var(--line)}
.bm .t.w{font-weight:700;background:var(--win-bg)}
.bm .meta{font-size:11px;color:var(--muted);padding:3px 10px;background:var(--card2);border-top:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty .e{font-size:34px}
.steps{display:grid;gap:10px;margin-top:6px}
.step{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px dashed var(--line2);border-radius:10px}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri-ink);font-weight:700;flex:none}
.step.ok .n{background:var(--ok);color:var(--card)}
.step .tx{flex:1}
.news{padding:12px 0;border-top:1px solid var(--line)}
.news:first-child{border-top:none}
.news h4{margin:0 0 4px;font-size:15.5px}
.news .d{font-size:12px;color:var(--muted)}
.news p{margin:6px 0 0;white-space:pre-wrap}
.pin{color:var(--warn);font-size:12px;font-weight:700}
.athlist{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.athlist li{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:3px 6px 3px 10px;font-size:13.5px;display:flex;gap:4px;align-items:center}
.athlist li button{border:none;background:none;cursor:pointer;color:var(--danger);font-size:15px;padding:0 4px;font-weight:700}
.cnt{font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--neutral-bg);color:var(--neutral-ink)}
.cnt.full{background:var(--ok-bg);color:var(--ok)}
#modal{position:fixed;inset:0;background:rgba(10,10,35,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 12px;overflow-y:auto}
#modal.open{display:flex}
.mbox{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbox.wide{max-width:720px}
.mhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.mhead h3{margin:0;font-size:17px;flex:1}
.mbody{padding:16px 20px;display:grid;gap:12px}
.mfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.fl{display:grid;gap:4px}
.fl>span{font-size:13px;font-weight:600;color:var(--ink)}
.fl small{color:var(--muted);font-size:12px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chks{display:flex;flex-wrap:wrap;gap:6px 14px}
.chks label{display:flex;gap:6px;align-items:center;font-size:14px}
input[type=checkbox]{accent-color:var(--pri);width:16px;height:16px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:grid;gap:8px}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.err{background:#b42318;color:#fff}
.muted{color:var(--muted)}
.poolbox{margin:10px 0 4px}
.poolbox summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;color:var(--pri-ink)}
.poolbox summary::-webkit-details-marker{display:none}
.poolbox[open] summary{margin-bottom:6px}
.pooldh{font-weight:700;color:var(--pri-ink);margin:12px 0 2px;font-size:14.5px}
.poolrow{display:grid;grid-template-columns:150px 1fr 1fr;gap:10px;padding:8px 4px;border-top:1px solid var(--line);align-items:start}
.pev{font-weight:600;color:var(--ink);text-decoration:none}.pev:hover{color:var(--pri-ink);text-decoration:underline}
.pcol.wide{grid-column:2/4}
.ph{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.ptm{display:flex;gap:6px;align-items:center;font-size:13.5px;padding:1px 0;min-width:0}
.pcol{min-width:0}
@media (max-width:640px){.poolrow{grid-template-columns:1fr;gap:4px}.pev,.pcol.wide{grid-column:auto}}
.nimgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.nimgs img{max-width:100%;width:260px;max-height:340px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.ndocs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.nimgph{width:260px;height:160px;border-radius:10px;border:1px dashed var(--line2);display:grid;place-items:center;color:var(--muted);font-size:13px}
.ndoc{cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--card2);text-decoration:none;color:var(--ink);font-weight:500}
.ndoc small{color:var(--muted);font-weight:400}
.frow{display:flex;gap:8px;align-items:center;font-size:14px;padding:3px 0}.frow span{flex:1}
.staff{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;font-size:13.5px}
.slab{font-weight:600;color:var(--pri-ink);min-width:118px}
.spill{background:var(--pri-soft);border-radius:8px;padding:2px 4px 2px 10px;display:inline-flex;gap:2px;align-items:center}
.spill button{border:none;background:none;cursor:pointer;color:var(--danger);font-weight:700;padding:0 4px}
.sico{width:1.2em;height:1.2em;display:inline-block;vertical-align:-0.22em;flex:none}
.slot{display:flex;align-items:center;gap:10px;padding:7px 4px;border-top:1px solid var(--line)}
.pooltitle{font-weight:700;color:var(--pri-ink);margin-bottom:2px}
.sl{font-size:11.5px;font-weight:700;color:var(--pri-ink);background:var(--pri-soft);border-radius:6px;padding:1px 6px;min-width:26px;text-align:center;flex:none}
.repchip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;background:var(--ok-bg);color:var(--ink);border:1px solid var(--line);font-size:13.5px;font-weight:500}
.mt{margin-top:14px}
@media (max-width:640px){
  .fr{grid-template-columns:1fr}
  .match{grid-template-columns:48px 1fr}
  .hide-sm{display:none}
  header{padding:12px 14px 10px}
  .htitle h1{font-size:17px}
  .logo{width:48px;height:48px}
  main{padding:16px 12px 70px}
}

function medals(){
  const t={};for(const s of schoolsList())t[s.id]={id:s.id,g:0,s:0,b:0};
  for(const e of eventsList()){const r=e.result||{};const has=['g','s','b'].some(k=>(r[k]||[]).length);
    if(has){for(const k of ['g','s','b'])for(const sid of (r[k]||[]))if(t[sid])t[sid][k]++}
    else if(e.format==='pools')for(const sid of (e.reps||[]))if(t[sid])t[sid].g++}
  const arr=Object.values(t).map(x=>({...x,total:x.g+x.s+x.b}));
  arr.sort((a,b)=>b.g-a.g||b.s-a.s||b.b-a.b||sname(a.id).localeCompare(sname(b.id),'th'));
  let rank=0,prev=null;arr.forEach((x,i)=>{const k=x.g+'-'+x.s+'-'+x.b;if(k!==prev){rank=i+1;prev=k}x.rank=rank});
  return arr;
}
function standings(evId,msIn){
  const T={};const add=id=>T[id]??={id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
  (S.events[evId]?.teams||[]).forEach(add);
  for(const m of (msIn||matchesOf(evId))){if(m.stage!=='league'||m.status!=='done'||m.sa==null||m.sb==null||!m.a||!m.b)continue;
    const A=add(m.a),B=add(m.b);A.p++;B.p++;A.gf+=m.sa;A.ga+=m.sb;B.gf+=m.sb;B.ga+=m.sa;
    if(m.sa>m.sb){A.w++;B.l++;A.pts+=3}else if(m.sa<m.sb){B.w++;A.l++;B.pts+=3}else{A.d++;B.d++;A.pts++;B.pts++}}
  return Object.values(T).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
}

function toast(msg,err){const el=document.createElement('div');el.className='toast'+(err?' err':'');el.textContent=msg;$('#toast').appendChild(el);setTimeout(()=>el.remove(),err?5000:2600)}
function errMsg(e){const c=e?.code;if(c==='invalid_argument')return 'บันทึกไม่ได้: บัญชีนี้ไม่มีสิทธิ์แก้ไขข้อมูลส่วนนี้';if(c==='quota_exceeded')return 'พื้นที่จัดเก็บเต็ม: '+(e.message||'');if(c==='resource_exhausted')return 'ทำรายการถี่เกินไป กรุณารอสักครู่แล้วลองใหม่';if(c==='revoked')return 'สิทธิ์การเข้าถึงถูกเปลี่ยน กรุณาเปิดหน้าใหม่';return 'บันทึกไม่สำเร็จ ('+(c||e?.message||'ไม่ทราบสาเหตุ')+')'}
async function retry(fn){try{return await fn()}catch(e){if(e?.code==='unavailable'){await new Promise(r=>setTimeout(r,400+Math.random()*600));return await fn()}throw e}}
function dlSave({filename,data}){const blob=data instanceof Blob?data:new Blob([data],{type:/\.html?$/i.test(filename)?'text/html;charset=utf-8':'application/octet-stream'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
const DL={save:async o=>dlSave(o)};

const api={

    const {error}=await SB.from('docs').upsert({col,id,data});sbErr(error);S[col][id]=JSON.parse(JSON.stringify(data));sched()},
  async upd(col,id,patch){return api.set(col,id,{...(S[col][id]||{}),...patch})},
  async del(col,id){if(DEMO){delete S[col][id];sched();return}
    const {error}=await SB.from('docs').delete().eq('col',col).eq('id',id);sbErr(error);delete S[col][id];sched()},

function roundName(n){return n===2?'ชิงชนะเลิศ':n===4?'รองชนะเลิศ':n===8?'ก่อนรองชนะเลิศ':`รอบ ${n} ทีม`}
function seedOrder(size){let o=[1];while(o.length<size){const L=o.length*2;o=o.flatMap(x=>[x,L+1-x])}return o}
function baseMatch(evId,venue){return {eventId:evId,a:null,b:null,sa:null,sb:null,status:'scheduled',winner:null,date:'',time:'',venue:venue||'',note:''}}
function buildKO(evId,teams,o){
  const n=teams.length;let size=1;while(size<n)size*=2;const R=Math.log2(size);
  const ids=[];for(let r=0;r<R;r++)ids.push(Array.from({length:size>>(r+1)},()=>newId()));
  const thirdId=(o.third&&R>=2)?newId():null;const ord=seedOrder(size);const M={};
  for(let r=0;r<R;r++){const cnt=size>>(r+1);for(let i=0;i<cnt;i++){
    const m={...baseMatch(evId,o.venue),round:roundName(size>>r),rIdx:r,pos:i,stage:r===R-1?'final':(r===R-2?'semi':'ko'),
      next:r<R-1?{id:ids[r+1][i>>1],slot:i%2?'b':'a'}:null,loserNext:(thirdId&&r===R-2)?{id:thirdId,slot:i%2?'b':'a'}:null};
    if(r===0){m.a=teams[ord[2*i]-1]||null;m.b=teams[ord[2*i+1]-1]||null}
    M[ids[r][i]]=m}}
  if(thirdId)M[thirdId]={...baseMatch(evId,o.venue),round:'ชิงอันดับ 3',rIdx:R-1,pos:-1,stage:'third',next:null,loserNext:null};
  for(const id of ids[0]){const m=M[id];if(m.a&&!m.b){m.status='bye';m.winner=m.a;if(m.next)M[m.next.id][m.next.slot]=m.a}}
  return M;
}
function buildRR(evId,teams,o){
  const t=[...teams];if(t.length%2)t.push(null);const n=t.length;const M={};
  for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a&&b)M[newId()]={...baseMatch(evId,o.venue),a,b,round:'นัดที่ '+(r+1),rIdx:r,pos:i,stage:'league'}}t.splice(1,0,t.pop())}
  return M;
}
const POOLS={A:['A1','A2','A3','A4'],B:['B1','B2','B3','B4']};
function buildPools(evId,slots,venue){
  const teams=[...POOLS.A,...POOLS.B].map(k=>slots[k]).filter(Boolean);const M={};
  if(teams.length<=2)return {M,mode:teams.length?'auto':'none',need:teams.length,autoReps:teams,teams};
  if(teams.length===3){const R=buildRR(evId,teams,{venue});Object.values(R).forEach(m=>{m.round='พบกันหมด '+m.round});return {M:R,mode:'rr',need:2,autoReps:[],teams}}
  let need=0;const autoReps=[];
  for(const p of ['A','B']){
    const K=POOLS[p];const h1=K.slice(0,2).filter(k=>slots[k]),h2=K.slice(2).filter(k=>slots[k]);const cnt=h1.length+h2.length;if(!cnt)continue;need++;
    if(cnt===1){autoReps.push(slots[(h1[0]||h2[0])]);continue}
    const fid=newId();const fin={...baseMatch(evId,venue),pool:p,round:'ชิงชนะเลิศสาย '+p,rIdx:1,pos:p==='A'?0:1,stage:'pfinal',next:null,loserNext:null,la:'',lb:''};
    if(h1.length&&h2.length){
      [[h1,K.slice(0,2),'a',0],[h2,K.slice(2),'b',1]].forEach(([h,all,slot,pos])=>{const id=newId();
        const m={...baseMatch(evId,venue),pool:p,round:'รอบแรก สาย '+p,rIdx:0,pos:(p==='A'?0:2)+pos,stage:'psemi',a:slots[h[0]],la:h[0],next:{id:fid,slot},loserNext:null};
        if(h.length===2){m.b=slots[h[1]];m.lb=h[1]}else{m.b=null;m.lb=all.find(k=>!slots[k]);m.status='bye';m.winner=m.a;fin[slot]=m.a}
        M[id]=m});
    }else{const h=h1.length?h1:h2;fin.a=slots[h[0]];fin.b=slots[h[1]];fin.la=h[0];fin.lb=h[1];fin.rIdx=0}
    M[fid]=fin;
  }
  return {M,mode:'ko',need,autoReps,teams};
}
const AUTO_SPORTS=['E-Sport','เปตอง','แบดมินตัน','เทเบิลเทนนิส'];
const regSchools=evId=>[...new Set(athList().filter(a=>a.eventId===evId).map(a=>a.schoolId))].filter(id=>S.schools[id]);
function buildAuto(evId,teams,venue){
  const t=[...teams];const M={};
  if(t.length<=2)return {M,mode:t.length?'auto':'none',need:t.length,autoReps:t,teams:t};
  if(t.length===3){const R=buildRR(evId,t,{venue});Object.values(R).forEach(m=>{m.round='พบกันหมด '+m.round});return {M:R,mode:'rr',need:2,autoReps:[],teams:t}}
  const sh=t.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  return {M:buildKO(evId,sh,{venue,third:false}),mode:'knock',need:2,autoReps:[],teams:sh};
}
function tieCut(a,b){return a&&b&&a.pts===b.pts&&(a.gf-a.ga)===(b.gf-b.ga)&&a.gf===b.gf}
function derivePools(ev,evId,local){
  if(ev.repsManual)return null;
  const ms=Object.entries(local).filter(([,x])=>x.eventId===evId).map(([id,x])=>({id,...x}));
  if(ev.poolMode==='rr'){const lg=ms.filter(x=>x.stage==='league');if(!lg.length||!lg.every(x=>x.status==='done'))return [];
    const tb=standings(evId,lg);if(tieCut(tb[1],tb[2])){toast('อันดับ 2 กับ 3 คะแนนเท่ากัน กรุณากดปุ่ม “กำหนดตัวแทนเอง”',true);return []}return tb.slice(0,2).map(x=>x.id)}
  if(ev.poolMode==='knock'){const f=ms.find(x=>x.stage==='final');if(f&&f.status==='done'&&f.winner)return [f.winner,f.winner===f.a?f.b:f.a].filter(Boolean);return []}
  const r=[...(ev.autoReps||[])];ms.filter(x=>x.stage==='pfinal'&&x.status==='done'&&x.winner).sort((a,b)=>a.pos-b.pos).forEach(x=>r.push(x.winner));return r;
}
function assignTimes(M,o){
  if(!o.date)return;const arr=Object.values(M).filter(m=>m.status!=='bye').sort((a,b)=>a.rIdx-b.rIdx||(a.stage==='third')-(b.stage==='third')||a.pos-b.pos);
  let [h,mi]=(o.time||'09:00').split(':').map(Number);const step=Number(o.step)||60;let t=h*60+mi;
  for(const m of arr){m.date=o.date;m.time=String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0');t+=step}
}
function deriveKO(evId,M){
  const ms=Object.values(M).filter(x=>x.eventId===evId);const loser=x=>x.winner===x.a?x.b:x.a;
  const fin=ms.find(x=>x.stage==='final'),third=ms.find(x=>x.stage==='third');const r={g:[],s:[],b:[]};
  if(fin&&fin.status==='done'&&fin.winner){r.g=[fin.winner];if(loser(fin))r.s=[loser(fin)]}
  if(third){if(third.status==='done'&&third.winner)r.b=[third.winner]}
  else r.b=ms.filter(x=>x.stage==='semi'&&x.status==='done'&&x.winner&&loser(x)).map(loser);
  return r;
}

/* ---------- โปรแกรม ---------- */
function poolSummary(ms){
  let evs=eventsList().filter(e=>(e.teams||[]).length);
  if(ui.schedSport!=='all')evs=evs.filter(e=>e.sport===ui.schedSport);
  if(ui.schedSchool!=='all')evs=evs.filter(e=>(e.teams||[]).includes(ui.schedSchool));
  if(ui.schedDate!=='all'){const ids=new Set(ms.map(m=>m.eventId));evs=evs.filter(e=>ids.has(e.id))}
  if(!evs.length)return '';
  const hl=id=>ui.schedSchool!=='all'&&id===ui.schedSchool?' style="font-weight:700"':'';
  const team=(sl,k)=>sl[k]?`<div class="ptm"${hl(sl[k])}><span class="sl">${k}</span>${schip(sl[k],true)}</div>`:'';
  const by={};evs.forEach(e=>(by[e.sport]??=[]).push(e));
  return `<details class="card poolbox" open><summary><b>🧩 การแบ่งสายการแข่งขัน</b> <span class="muted" style="font-size:13px">${evs.length} รายการ · แตะเพื่อย่อ/ขยาย</span></summary>
  ${Object.entries(by).map(([sp,arr])=>`<div class="pooldh">${icon(sp)} ${esc(sp)}</div>${arr.map(e=>{const sl=e.slots||{};let body;
    if(e.format==='pools'&&e.poolMode==='rr')body=`<div class="pcol wide"><div class="ph">พบกันหมด · ที่ 1–2 เป็นตัวแทน</div>${(e.teams||[]).map(t=>`<div class="ptm"${hl(t)}>${schip(t,true)}</div>`).join('')}</div>`;
    else if(e.format==='pools'&&e.poolMode==='auto')body=`<div class="pcol wide"><div class="ph">ตัวแทนอัตโนมัติ (ไม่มีการแข่งขัน)</div>${(e.teams||[]).map(t=>`<div class="ptm"${hl(t)}>${schip(t,true)}</div>`).join('')}</div>`;
    else if(e.format==='pools'&&e.poolMode==='knock')body=`<div class="pcol wide"><div class="ph">แพ้คัดออก · ชนะเลิศ–รองชนะเลิศเป็นตัวแทน</div>${(e.teams||[]).map(t=>`<div class="ptm"${hl(t)}>${schip(t,true)}</div>`).join('')}</div>`;
    else if(e.format==='pools')body=['A','B'].map(p=>`<div class="pcol"><div class="ph">สาย ${p}</div>${POOLS[p].map(k=>team(sl,k)).join('')||'<div class="ptm muted">–</div>'}</div>`).join('');
    else body=`<div class="pcol wide"><div class="ph">${esc(FORMATS[e.format]||'ทีมที่เข้าร่วม')}</div>${(e.teams||[]).map(t=>`<div class="ptm"${hl(t)}>${schip(t,true)}</div>`).join('')}</div>`;
    return `<div class="poolrow"><a class="pev" href="#event-${e.id}">${esc([e.item,e.gender,e.age].filter(Boolean).join(' ')||e.sport)}</a>${body}</div>`}).join('')}`).join('')}
  </details>`;
}
function pSchedule(){

    <select class="f" data-ui="schedSchool">${opt('all','ทุกโรงเรียน',ui.schedSchool==='all')}${schoolsList().map(s=>opt(s.id,s.name,ui.schedSchool===s.id)).join('')}</select>
  </div>
  ${pools}
  ${Object.keys(groups).length?Object.entries(groups).map(([d,arr])=>`<div class="dayh ${d===td?'today':''}">${esc(fmtDate(d,true))}</div><div class="card">${arr.map(m=>matchRow(m)).join('')}</div>`).join(''):`<div class="card">${emptyBox('🗓️','ไม่มีแมตช์ตามเงื่อนไขที่เลือก',isAdmin()?'จัดสายการแข่งขันได้จากหน้า “รายการแข่งขัน”':'')}</div>`}`;
}

  }else{

    body=Object.keys(by).length?Object.entries(by).map(([s,arr])=>`<div class="dayh">${icon(s)} ${esc(s)}</div><div class="grid g3">${arr.map(e=>`<div class="card clickable" data-act="go" data-to="event-${e.id}"><div style="font-weight:600;margin-bottom:8px">${esc([e.item,e.gender,e.age].filter(Boolean).join(' '))}</div>${podium(e)}</div>`).join('')}</div>`).join(''):`<div class="card">${emptyBox('🏁','ยังไม่มีรายการที่สรุปผล')}</div>`;

  return `<h2 class="pt">ผลการแข่งขัน</h2><p class="sub">อัปเดตทันทีเมื่อบันทึกผล</p>${tabs}${body}`;

function staffRow(e,sid,stf,closed){

  return one('coach','ผู้ฝึกสอน',1)+one('assistant','ผู้ช่วยผู้ฝึกสอน',assistMax(e.sport));
}

/* ---------- เกียรติบัตร ---------- */
const AWARD={win:['รางวัลชนะเลิศ','b-done'],join:['เข้าร่วมการแข่งขัน','b-sch'],pending:['รอผลการแข่งขัน','b-bye']};
function certRows(){
  const rows=[];const ppl=list('athletes');
  for(const e of eventsList()){
    const reg=new Set(ppl.filter(a=>a.eventId===e.id).map(a=>a.schoolId));
    const sids=[...new Set([...(e.teams||[]),...reg])].filter(id=>S.schools[id]);if(!sids.length)continue;
    const done=evStatus(e)==='done';const reps=new Set(e.format==='pools'?(e.reps||[]):[...(e.result?.g||[])]);
    for(const sid of sids){const ps=ppl.filter(a=>a.eventId===e.id&&a.schoolId===sid);
      rows.push({e,sid,award:!done?'pending':reps.has(sid)?'win':'join',ps,nAth:ps.filter(a=>!isStaff(a)).length,nStf:ps.filter(isStaff).length})}
  }
  return rows;
}
function certFiltered(){
  let r=certRows();const co=isCoord();
  if(co)r=r.filter(x=>x.sid===mySchool());else if(ui.cSchool&&ui.cSchool!=='all')r=r.filter(x=>x.sid===ui.cSchool);
  if(ui.cSport&&ui.cSport!=='all')r=r.filter(x=>x.e.sport===ui.cSport);
  if(ui.cAward&&ui.cAward!=='all')r=r.filter(x=>x.award===ui.cAward);
  return r;
}
function refRows(){
  const m={};const add=(sp,n)=>{n=(n||'').trim();if(!n||!sp)return;(m[sp]??=new Set()).add(n)};
  matchesList().forEach(x=>{const sp=S.events[x.eventId]?.sport;(x.refs||[]).forEach(n=>add(sp,n))});
  Object.entries(cfg().extraRefs||{}).forEach(([sp,arr])=>(arr||[]).forEach(n=>add(sp,n)));
  const order=[...new Set(eventsList().map(e=>e.sport))];
  return Object.entries(m).map(([sp,set])=>({sp,names:[...set].sort((a,b)=>a.localeCompare(b,'th'))})).sort((a,b)=>order.indexOf(a.sp)-order.indexOf(b.sp));
}

/* ไฟล์แนบเก็บในฐานข้อมูลเป็นชิ้น (newsfiles/{fid}_{i}) */
const FCHUNK=180000;const fileCache={};const fileLoading={};const memFiles={};
function b64ToBlob(b64,type){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type})}
function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(blob)})}
const fileUrl=f=>SB.storage.from(BUCKET).getPublicUrl(f.path).data.publicUrl;
async function loadFile(f){
  if(fileCache[f.fid])return fileCache[f.fid];
  if(DEMO){const b=memFiles[f.fid];if(b)fileCache[f.fid]={blob:b,url:URL.createObjectURL(b)};return fileCache[f.fid]}
  if(!f.path){fileCache[f.fid]={err:true};return fileCache[f.fid]}
  if(/^image\//.test(f.type||'')){fileCache[f.fid]={url:fileUrl(f)};return fileCache[f.fid]}
  if(!fileLoading[f.fid])fileLoading[f.fid]=(async()=>{const r=await fetch(fileUrl(f));if(!r.ok)throw new Error('HTTP '+r.status);const blob=await r.blob();fileCache[f.fid]={blob,url:URL.createObjectURL(blob)};return fileCache[f.fid]})().catch(e=>{delete fileLoading[f.fid];throw e});
  return fileLoading[f.fid];
}
async function saveFileChunks(blob,meta){
  const fid=newId();if(DEMO){memFiles[fid]=blob;return {fid,n:1,...meta,size:blob.size}}
  const path=fid+(meta.type==='application/pdf'?'.pdf':'.jpg');
  const {error}=await SB.storage.from(BUCKET).upload(path,blob,{contentType:meta.type,upsert:false});sbErr(error);
  return {fid,n:1,path,...meta,size:blob.size};
}
async function deleteFileChunks(f){if(DEMO){delete memFiles[f.fid];return}if(!f.path)return;try{await SB.storage.from(BUCKET).remove([f.path])}catch(e){console.warn(e)}}
async function shrinkImage(file){
  const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const M=1800;const k=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',0.85))}finally{URL.revokeObjectURL(url)}
}
function attachHtml(files){if(!files||!files.length)return '';
  const imgs=files.filter(f=>/^image\//.test(f.type)),docs=files.filter(f=>!/^image\//.test(f.type));
  imgs.forEach(f=>{if(!fileCache[f.fid])loadFile(f).catch(()=>{})});
  const sz=f=>f.size>=1048576?(f.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(f.size/1024))+' KB';
  return `${imgs.length?`<div class="nimgs">${imgs.map(f=>{const c=fileCache[f.fid];return c?.url?`<img src="${c.url}" alt="${esc(f.name||'')}" class="clickable" data-act="viewImg" data-fid="${esc(f.fid)}">`:`<div class="nimgph">${c?.err?'โหลดรูปไม่สำเร็จ':'กำลังโหลดรูป…'}</div>`}).join('')}</div>`:''}${docs.length?`<div class="ndocs">${docs.map(f=>`<button type="button" class="ndoc" data-act="openFile" data-fid="${esc(f.fid)}" data-name="${esc(f.name||'ไฟล์แนบ.pdf')}" data-type="${esc(f.type)}" data-n="${f.n||1}">📄 ${esc(f.name||'ไฟล์แนบ.pdf')} <small>${sz(f)} · ดาวน์โหลด</small></button>`).join('')}</div>`:''}`}

async function saveMatch(mid,fd){
  const m=S.matches[mid];const ev=S.events[m.eventId];const ko=ev?.format==='knockout'||(ev?.format==='pools'&&m.stage!=='league');const pools=ev?.format==='pools';
  const nm={...m,a:fd.get('a')||null,b:fd.get('b')||null,sa:num(fd.get('sa')),sb:num(fd.get('sb')),status:fd.get('status'),date:fd.get('date')||'',time:fd.get('time')||'',venue:(fd.get('venue')||'').trim(),note:(fd.get('note')||'').trim(),refs:fd.getAll('ref').map(x=>x.trim()).filter(Boolean)};
  if(nm.a&&nm.a===nm.b){toast('เลือกทีมซ้ำกัน',true);return false}
  if(nm.status==='done'){
    if(nm.sa==null||nm.sb==null){toast('กรอกคะแนนให้ครบก่อนจบการแข่งขัน',true);return false}
    let w=ko?(fd.get('winner')||''):'';if(!w){if(nm.sa>nm.sb)w=nm.a;else if(nm.sb>nm.sa)w=nm.b}
    if(ko&&!w){toast('คะแนนเสมอ กรุณาเลือกผู้ชนะ',true);return false}
    nm.winner=w||null;
  }else nm.winner=null;
  const changes=[['matches',mid,nm]];const local={...S.matches,[mid]:nm};
  if(ko){
    const put=(ref,val)=>{if(!ref||!local[ref.id])return;const t={...local[ref.id],[ref.slot]:val};if(t.status==='done'&&t[ref.slot]!==local[ref.id][ref.slot]){t.status='scheduled';t.winner=null;t.sa=null;t.sb=null}local[ref.id]=t;changes.push(['matches',ref.id,t])};
    const done=nm.status==='done'&&nm.winner;
    const loser=done?(nm.winner===nm.a?nm.b:nm.a):null;
    if(nm.next&&(local[nm.next.id]?.[nm.next.slot]||null)!==(done?nm.winner:null))put(nm.next,done?nm.winner:null);
    if(nm.loserNext&&(local[nm.loserNext.id]?.[nm.loserNext.slot]||null)!==(loser||null))put(nm.loserNext,loser||null);
    if(!pools){const res=deriveKO(m.eventId,local);
    if(JSON.stringify(res)!==JSON.stringify(ev.result||{}))changes.push(['events',m.eventId,{...ev,result:res}]);}
  }
  if(pools){const reps=derivePools(ev,m.eventId,local);if(reps&&JSON.stringify(reps)!==JSON.stringify(ev.reps||[]))changes.push(['events',m.eventId,{...ev,reps}])}
  return run(async()=>{for(const [c,id,data] of changes)await api.set(c,id,data)},nm.status==='done'?'บันทึกผลแล้ว':'บันทึกแล้ว');
}

let libsP=null;
function loadLibs(){if(libsP)return libsP;const L=src=>new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=()=>rej(new Error('load'));document.head.appendChild(sc)});
  libsP=Promise.all([L('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),L('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')]).catch(e=>{libsP=null;throw e});return libsP}
let pdfBusy=false;
async function makePdf(filename,headHtml,blocks,fmt,opt={}){
  if(pdfBusy)return;pdfBusy=true;let host=null;
  try{
    const dl=DEMO?null:DL;
    toast(fmt==='html'?'กำลังจัดหน้า…':'กำลังสร้างไฟล์ PDF…');
    if(fmt!=='html')await loadLibs();try{await document.fonts.ready}catch(e){}
    host=document.createElement('div');host.className='pdfhost';document.body.appendChild(host);
    let pages=[];let page,body,rep=null;
    if(opt.raw){pages=opt.raw.map(h=>{const p=document.createElement('div');p.className='pdfpage certpage';p.innerHTML=h;host.appendChild(p);return p})}else{
    const newPage=()=>{page=document.createElement('div');page.className='pdfpage';page.innerHTML=`<div class="pdfhead">${headHtml}</div><div class="pdfbody"></div><div class="pdffoot"></div>`;host.appendChild(page);body=page.querySelector('.pdfbody');pages.push(page);if(rep){const t=document.createElement('div');t.innerHTML=rep;body.appendChild(t.firstElementChild)}};
    const over=()=>{const l=body.lastElementChild;return !!l&&l.getBoundingClientRect().bottom>body.getBoundingClientRect().bottom-14};
    newPage();
    for(const b of blocks){
      if(b.brk){rep=null;if(body.children.length)newPage();continue}
      const isHead=b.rep!==undefined;if(isHead)rep=null;
      const t=document.createElement('div');t.innerHTML=b.h;const node=t.firstElementChild;body.appendChild(node);
      if(over()&&body.children.length>1){body.removeChild(node);newPage();body.appendChild(node)}
      if(isHead)rep=b.rep;
    }
    pages.forEach((p,i)=>{p.querySelector('.pdffoot').textContent=`พิมพ์เมื่อ ${new Date().toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})} · หน้า ${i+1}/${pages.length}`});}
    if(opt.raw)for(const im of host.querySelectorAll('img'))if(!im.complete)await new Promise(r=>{im.onload=im.onerror=r});
    if(fmt==='html'){
      const doc=`<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><title>${esc(filename)}</title><link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&display=swap" rel="stylesheet"><style>@page{size:A4 ${opt.land?'landscape':'portrait'};margin:0}html,body{margin:0;background:#888}@media print{html,body{background:#fff}.pdfpage{margin:0!important;box-shadow:none!important}}.pdfpage{margin:12px auto!important;box-shadow:0 2px 10px rgba(0,0,0,.3);page-break-after:always;break-after:page}${PDF_CSS_ALL.replace(/\.pdfhost\{[^}]*\}/,'')}</style></head><body>${pages.map(p=>p.outerHTML).join('')}<script>window.addEventListener('load',()=>setTimeout(()=>window.print(),800))<\/script></body></html>`;
      const fn=filename.replace(/\.pdf$/,'')+' (พร้อมพิมพ์).html';
      if(DEMO){window.__lastPdf={filename:fn,pages:pages.length,size:doc.length,html:true};toast(`สร้างไฟล์ ${pages.length} หน้าแล้ว (โหมดทดลองไม่บันทึกไฟล์)`);return}
      try{await dl.save({filename:fn,data:doc});toast('บันทึกแล้ว เปิดไฟล์ด้วยเบราว์เซอร์แล้วสั่งพิมพ์ หรือเลือก “บันทึกเป็น PDF”')}catch(e){if(e?.code!=='declined')toast('บันทึกไฟล์ไม่สำเร็จ ('+(e?.code||e?.message||'')+')',true)}
      return;
    }
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'pt',format:'a4',orientation:opt.land?'landscape':'portrait',compress:true});const PW=opt.land?841.89:595.28,PH=opt.land?595.28:841.89;
    for(let i=0;i<pages.length;i++){const c=await window.html2canvas(pages[i],{scale:opt.raw?1.6:2,backgroundColor:'#ffffff',logging:false});const img=c.toDataURL('image/jpeg',opt.raw?0.85:0.9);if(DEMO)(window.__pdfImgs??=[]).push(img);if(i)pdf.addPage();pdf.addImage(img,'JPEG',0,0,PW,PH);if(pages.length>8&&i%5===4)toast(`กำลังสร้าง… ${i+1}/${pages.length} หน้า`)}
    const blob=pdf.output('blob');
    if(DEMO){window.__lastPdf={filename,pages:pages.length,size:blob.size};toast(`สร้าง PDF ${pages.length} หน้าแล้ว (โหมดทดลองไม่บันทึกไฟล์)`);return}
    try{await dl.save({filename,data:blob});toast('บันทึกไฟล์ PDF แล้ว')}catch(e){if(e?.code!=='declined')toast('บันทึกไฟล์ไม่สำเร็จ ('+(e?.code||e?.message||'')+')',true)}
  }catch(e){console.error(e);toast('สร้าง PDF ไม่สำเร็จ: '+(e.message||e),true)}
  finally{pdfBusy=false;if(host)host.remove()}
}
function exportDoc(filename,head,blocks){
  openModal('ส่งออกเอกสาร',`<p style="margin:0">ขนาด A4 แนวตั้ง พร้อมเลขหน้า</p>
  <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px"><button type="button" class="btn pri" id="xPdf" style="justify-content:center;padding:14px">📄 ไฟล์ PDF</button><button type="button" class="btn" id="xHtml" style="justify-content:center;padding:14px">🖨️ ไฟล์พร้อมพิมพ์</button></div>
  <small class="muted">ไฟล์ PDF: เปิดและส่งต่อได้ทันที · ไฟล์พร้อมพิมพ์: เปิดในเบราว์เซอร์แล้วจะขึ้นหน้าสั่งพิมพ์ เลือกเครื่องพิมพ์ หรือเลือก “บันทึกเป็น PDF” ได้ ตัวอักษรไทยคมชัดที่สุด</small>`);
  $('#xPdf').onclick=()=>{closeModal();makePdf(filename,head,blocks,'pdf')};
  $('#xHtml').onclick=()=>{closeModal();makePdf(filename,head,blocks,'html')};
}

function athDoc(o){
  // o: {scope: sid|'all', group:'school'|'sport', sport:'all'|name}
  const sids=o.scope==='all'?schoolsList().map(x=>x.id):[o.scope];
  const ppl=list('athletes').filter(a=>sids.includes(a.schoolId));
  let evs=eventsList();if(o.sport!=='all')evs=evs.filter(e=>e.sport===o.sport);
  const blocks=[];let any=false;
  if(o.group==='school'){
    sids.forEach(sid=>{
      const all=ppl.filter(a=>a.schoolId===sid&&evs.some(e=>e.id===a.eventId));if(!all.length&&o.scope==='all')return;
      if(blocks.length)blocks.push({brk:true});
      blocks.push({h:`<div style="font-size:15px;font-weight:700;color:#1e1b4b">โรงเรียน${schShort(sid)} <span style="font-weight:400;font-size:12.5px;color:#444">· นักกีฬา ${all.filter(a=>!isStaff(a)).length} รายชื่อ · ผู้ฝึกสอนและผู้ช่วย ${all.filter(isStaff).length} รายชื่อ</span></div>`});
      evs.forEach(e=>{const ps=all.filter(a=>a.eventId===e.id);if(!ps.length)return;any=true;blocks.push({h:evBlock(e,ps,esc(evTitle(e)))})});
      blocks.push({h:signSchool(sid)});
    });
  }else{
    const sports=[...new Set(evs.map(e=>e.sport))];
    sports.forEach(sp=>{
      const se=evs.filter(e=>e.sport===sp);const sp_ppl=ppl.filter(a=>se.some(e=>e.id===a.eventId));if(!sp_ppl.length)return;
      if(blocks.length)blocks.push({brk:true});
      blocks.push({h:`<div style="font-size:16px;font-weight:700;color:#1e1b4b">ชนิดกีฬา: ${esc(sp)} <span style="font-weight:400;font-size:12.5px;color:#444">· นักกีฬา ${sp_ppl.filter(a=>!isStaff(a)).length} รายชื่อ · ผู้ฝึกสอนและผู้ช่วย ${sp_ppl.filter(isStaff).length} รายชื่อ${o.scope!=='all'?' · โรงเรียน'+schShort(o.scope):''}</span></div>`});
      se.forEach(e=>{
        const ep=sp_ppl.filter(a=>a.eventId===e.id);if(!ep.length)return;any=true;
        if(o.scope==='all'){
          blocks.push({h:`<div style="margin-top:12px;font-weight:700;font-size:14px;border-left:4px solid #4338ca;padding-left:8px">${esc(evTitle(e))}</div>`});
          sids.forEach(sid=>{const ps=ep.filter(a=>a.schoolId===sid);if(ps.length)blocks.push({h:evBlock(e,ps,'โรงเรียน'+schShort(sid))})});
        }else blocks.push({h:evBlock(e,ep,esc(evTitle(e)))});
      });
      blocks.push({h:o.scope==='all'?signReg:signSchool(o.scope)});
    });
  }
  const parts=['รายชื่อนักกีฬา',o.sport!=='all'?o.sport:(o.group==='sport'?'แยกตามชนิดกีฬา':''),o.scope==='all'?'ทุกโรงเรียน':sfull(o.scope)].filter(Boolean);
  return {any,blocks,filename:parts.join(' ').replace(/[\\/:*?"<>|]/g,' ')+'.pdf',head:pdfHead('บัญชีรายชื่อนักกีฬาและผู้ฝึกสอน'+(o.sport!=='all'?' · '+esc(o.sport):''))};
}

A.editNews=d=>{const n=d.id?S.news[d.id]:{};let keep=[...(n.files||[])];
  const listHtml=()=>keep.map((f,k)=>`<div class="frow">${/^image\//.test(f.type)?'🖼️':'📄'} <span>${esc(f.name||'ไฟล์')}</span><button type="button" class="lnk" data-rmf="${k}" style="color:var(--danger)">ลบ</button></div>`).join('');
  openModal(d.id?'แก้ไขประกาศ':'เขียนประกาศ',`<label class="fl"><span>หัวข้อ</span><input class="f" name="title" value="${esc(n.title||'')}" required></label><label class="fl"><span>รายละเอียด</span><textarea class="f" name="body" style="min-height:150px">${esc(n.body||'')}</textarea></label>
  <div class="fl"><span>📎 ไฟล์แนบ (.jpg หรือ .pdf · PDF ไม่เกิน 8 MB · รูปถูกย่อให้อัตโนมัติ)</span><div id="nfList">${listHtml()}</div><input class="f" type="file" name="files" accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf" multiple></div>
  <div class="chks"><label><input type="checkbox" name="pin" ${n.pin?'checked':''}> ปักหมุดไว้ด้านบน</label></div>`,
  {wide:true,onSave:async fd=>{
    const picked=[...fd.getAll('files')].filter(f=>f&&f.size);
    for(const f of picked){const ok=/\.(jpe?g|png|pdf)$/i.test(f.name)||/^(image\/(jpeg|png)|application\/pdf)$/.test(f.type);if(!ok){toast(`“${f.name}” ไม่ใช่ไฟล์ .jpg หรือ .pdf`,true);return false}if(f.size>30*1024*1024){toast(`“${f.name}” ใหญ่เกินไป`,true);return false}}
    const added=[];
    if(picked.length){
      if(!DEMO&&!SB){toast('ยังเชื่อมต่อฐานข้อมูลไม่ได้',true);return false}
      for(const f of picked){const pdf=/\.pdf$/i.test(f.name)||f.type==='application/pdf';
        if(pdf&&f.size>8*1024*1024){toast(`“${f.name}” ใหญ่เกิน 8 MB (ไฟล์ PDF)`,true);return false}
        try{toast(`กำลังอัปโหลด “${f.name}”…`);const blob=pdf?f:await shrinkImage(f);
          added.push(await saveFileChunks(blob,{name:pdf?f.name:f.name.replace(/\.(png|jpe?g)$/i,'')+'.jpg',type:pdf?'application/pdf':'image/jpeg'}))}
        catch(e){toast(`อัปโหลด “${f.name}” ไม่สำเร็จ (${e?.code||e?.message||''})`,true);return false}}
    }
    const removed=(n.files||[]).filter(f=>!keep.some(k=>k.fid===f.fid));
    const files=[...keep,...added];
    const data={title:fd.get('title').trim(),body:fd.get('body').trim(),pin:!!fd.get('pin'),at:n.at||Date.now(),files};
    const ok=await run(()=>d.id?api.set('news',d.id,data):api.add('news',data),'บันทึกแล้ว');
    if(ok)for(const f of removed)await deleteFileChunks(f);
    return ok},
   danger:d.id?{text:'ลบประกาศ',fn:async()=>{const ok=await run(()=>api.del('news',d.id),'ลบแล้ว');if(ok)for(const f of (n.files||[]))await deleteFileChunks(f);return ok}}:null});
  $('#nfList').addEventListener('click',ev=>{const b=ev.target.closest('[data-rmf]');if(!b)return;keep.splice(+b.dataset.rmf,1);$('#nfList').innerHTML=listHtml()});
};

  [['ด.ช.ธนากร มีสุข','ม.3'],['ด.ช.ปกรณ์ ใจกล้า','ม.2']].forEach(([n,c])=>S.athletes[newId()]={schoolId:sid[0],eventId:r1,name:n,cls:c});
  S.news[newId()]={title:'ประชุมผู้ฝึกสอนและจับสลากแบ่งสาย',body:'ขอเชิญผู้ฝึกสอนทุกโรงเรียนร่วมประชุม ณ ห้องประชุมโรงเรียนเจ้าภาพ เวลา 13.30 น.',pin:true,at:Date.now()-86400000};
  S.news[newId()]={title:'ปรับเวลาแข่งขันวอลเลย์บอล',body:'เลื่อนเวลาแข่งขันรอบรองชนะเลิศเป็น 09.00 น.',pin:false,at:Date.now()-3600000};
  render();
}

/* ================= เริ่มต้น ================= */
async function loadAll(){
  const out={config:null};COLS.forEach(c=>out[c]={});let from=0;const step=1000;
  for(;;){const {data,error}=await SB.from('docs').select('col,id,data').order('col').order('id').range(from,from+step-1);if(error)throw error;
    for(const r of data){if(r.col==='config'){if(r.id==='main')out.config=r.data}else if(out[r.col])out[r.col][r.id]=r.data}
    if(data.length<step)break;from+=step}
  S.config=out.config;COLS.forEach(c=>S[c]=out[c]);loaded=true;stale=false;sched();
}
async function applySession(session){
  UID=session?.user?.id||null;PROFILE=null;ADMIN=false;PROFILES=[];
  if(UID){const {data}=await SB.from('profiles').select('*').eq('user_id',UID).maybeSingle();PROFILE=data||null;ADMIN=PROFILE?.role==='admin'}
  viewAs='auto';try{await loadAll()}catch(e){console.warn(e);stale=true;loaded=true;sched()}
}
async function init(){
  render();
  if(!window.supabase?.createClient){startDemo();return}
  SB=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  callUsers({action:'status'}).then(j=>{NEEDS_SETUP=!!j.needsSetup;sched()}).catch(()=>{});
  const {data:{session}}=await SB.auth.getSession();await applySession(session);
  let lastUid=UID;
  SB.auth.onAuthStateChange((ev,s)=>{const u=s?.user?.id||null;if(u!==lastUid){lastUid=u;setTimeout(()=>applySession(s),0)}});
  SB.channel('docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    if(p.eventType==='DELETE'){const o=p.old||{};if(o.col&&S[o.col]&&o.col!=='config'){delete S[o.col][o.id];sched()}return}
    const r=p.new;if(!r)return;if(r.col==='config'){if(r.id==='main'){S.config=r.data;sched()}}else if(S[r.col]){S[r.col][r.id]=r.data;sched()}
  }).subscribe();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SB)loadAll().catch(()=>{})});
}
init();
</script>
